<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Elia — a calm, personal AI chat experience.">
  <title>Elia — AI, in your flow</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --panel-soft: #f0f0ec;
      --ink: #242520;
      --muted: #85867f;
      --line: #e8e8e2;
      --accent: #282923;
      --accent-ink: #ffffff;
      --green: #557b5b;
      --shadow: 0 18px 55px rgba(29, 30, 24, .055);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); }
    button, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #8e9d80; outline-offset: 3px; }
    .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
    .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 24px 15px 16px; border-right: 1px solid var(--line); background: #f4f4f1; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 28px; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 11px; color: white; background: var(--accent); font-size: 18px; font-weight: 650; letter-spacing: -1.5px; }
    .brand-name { font-size: 19px; letter-spacing: -.7px; font-weight: 650; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .15px; }
    .new-chat { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 12px 14px; border: 1px solid #deded7; border-radius: 12px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 570; transition: background .15s, transform .15s; }
    .new-chat:hover { background: #fafaf8; transform: translateY(-1px); }

    .sidebar-tools { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; }
    .sidebar-tools .icon-button { border: 1px solid var(--line); background: var(--panel); }
    .sidebar-tools .icon-button:hover { background: rgba(118,118,128,.12); }

    .section-label { padding: 25px 10px 10px; color: #9a9b94; font-size: 10px; font-weight: 700; letter-spacing: 1.25px; text-transform: uppercase; }
    .history { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
    .history-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; color: #686961; font-size: 12px; }
    .history-item:hover, .history-item.active { background: #e9e9e4; color: var(--ink); }
    .history-item span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
    .history-empty { padding: 7px 10px; color: #a1a199; font-size: 12px; line-height: 1.6; }
    .sidebar-bottom { margin-top: auto; padding-top: 20px; }
    .status-card { display: flex; align-items: center; gap: 9px; padding: 12px 10px; border: 1px solid #e6e6df; border-radius: 12px; background: rgba(255,255,255,.6); }
    .status-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #b2b2a9; }
    .status-dot.online { background: #6d9b70; box-shadow: 0 0 0 3px rgba(109,155,112,.12); }
    .status-copy { min-width: 0; }
    .status-title { font-size: 11px; font-weight: 600; }
    .status-sub { margin-top: 3px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 70px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid rgba(232,232,226,.8); }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .mobile-brand { display: none; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; }
    .model-pill { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 99px; color: #66675f; background: rgba(255,255,255,.65); font-size: 11px; }
    .model-spark { color: #777b67; font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: #777870; cursor: pointer; }
    .icon-button:hover { border-color: var(--line); background: white; color: var(--ink); }
    .workspace { width: min(100%, 900px); margin: 0 auto; padding: 34px 28px 22px; flex: 1; display: flex; flex-direction: column; }
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 55px; animation: appear .45s ease both; }
    .welcome-mark { width: 54px; height: 54px; display: grid; place-items: center; margin-bottom: 25px; border-radius: 19px; background: #eaeae4; color: #34362d; font-size: 28px; font-weight: 500; letter-spacing: -2px; }
    .eyebrow { color: #85867d; font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; font-weight: 650; }
    h1 { margin: 13px 0 10px; text-align: center; font-size: clamp(29px, 4vw, 42px); letter-spacing: -1.8px; line-height: 1.13; font-weight: 570; }
    .welcome-copy { max-width: 410px; margin: 0; color: #83847d; text-align: center; font-size: 14px; line-height: 1.7; }
    .suggestions { width: min(100%, 590px); display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 34px; }
    .suggestion { display: flex; flex-direction: column; gap: 7px; min-height: 91px; padding: 15px 16px; border: 1px solid #e7e7e1; border-radius: 14px; background: rgba(255,255,255,.7); text-align: left; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
    .suggestion:hover { border-color: #d3d3ca; transform: translateY(-2px); box-shadow: var(--shadow); }
    .suggestion-title { font-size: 12px; font-weight: 630; }
    .suggestion-desc { color: #85867f; font-size: 11px; line-height: 1.5; }
    .thread { display: none; flex-direction: column; gap: 26px; padding: 14px 0 34px; }
    .thread.visible { display: flex; }
    .thread { gap: 30px; padding: 18px 0 210px; }
    .message { display: flex; width: 100%; min-width: 0; animation: appear .25s ease both; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .message-content { min-width: 0; max-width: min(82%, 690px); padding: 0; }
    .message.user .message-content { padding: 12px 16px; border-radius: 22px 22px 6px 22px; background: #e9e9e4; color: #292a24; }
    .message.assistant .message-content { max-width: 100%; width: 100%; padding: 0 4px; }
    .message-text { color: #33342e; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.user .message-text { line-height: 1.65; }
    .message-text code { padding: 2px 5px; border-radius: 5px; background: #efefea; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    .message-text pre { max-width: 100%; overflow-x: auto; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #f3f3ef; white-space: pre; }
    .message-text pre code { padding: 0; background: transparent; }
    .message-text strong { font-weight: 650; }
    .message-avatar, .message-author { display: none !important; }
    .message-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .attachment-chip { display: flex; align-items: center; gap: 7px; max-width: 230px; padding: 7px 9px; border: 1px solid #deded6; border-radius: 10px; background: rgba(255,255,255,.75); color: #55564e; font-size: 11px; }
    .attachment-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-chip img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    .composer-dock { position: fixed; z-index: 4; left: 252px; right: 0; bottom: 0; padding: 32px 30px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(247,247,245,0), rgba(247,247,245,.96) 25%, var(--bg) 55%); }
    .composer-inner { width: min(100%, 720px); margin: 0 auto; display: flex; align-items: flex-end; gap: 12px; padding-left: 14px; }
    .composer-wrap { position: static; flex: 1; min-width: 0; padding: 0; background: transparent; }
    .composer { position: relative; display: flex; align-items: flex-end; width: 100%; min-width: 0; gap: 10px; padding: 10px 10px 10px 18px; border: 1px solid #e3e3dc; border-radius: 999px; background: white; box-shadow: 0 9px 28px rgba(40,40,30,.045); transition: border-color .15s, box-shadow .15s; }
    .composer:focus-within { border-color: #cecec4; box-shadow: 0 10px 32px rgba(40,40,30,.07); }
    #chatForm { min-width: 0; margin: 0; }
    .composer-meta, .footer-note { display: none; }
    .attach-wrap { position: relative; flex: 0 0 auto; }
    .attach-button { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid #e3e3dc; border-radius: 50%; background: white; box-shadow: 0 7px 24px rgba(40,40,30,.05); cursor: pointer; font-size: 25px; color: #55564e; }
    .attach-button:hover { background: #f0f0ec; }
    .attach-menu { position: absolute; left: 0; bottom: 56px; display: none; width: 190px; padding: 6px; border: 1px solid var(--line); border-radius: 15px; background: white; box-shadow: 0 14px 40px rgba(30,30,20,.13); }
    .attach-menu.open { display: block; animation: appear .12s ease both; }
    .attach-option { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; font-size: 12px; cursor: pointer; }
    .attach-option:hover { background: #f3f3ef; }
    .pending-attachments { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 8px; }
    .pending-attachment { display: flex; align-items: center; gap: 7px; max-width: 230px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 11px; background: white; font-size: 11px; }
    .pending-attachment span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pending-attachment button { border: 0; background: transparent; color: #85867f; cursor: pointer; font-size: 16px; }
    .attachment-note { margin: 0 0 8px 3px; color: #85867f; font-size: 10px; }
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 7px 0; }
    .typing span { width: 5px; height: 5px; border-radius: 50%; background: #9a9b91; animation: pulse 1.1s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
    #prompt { display: block; flex: 1; width: 100%; min-width: 0; min-height: 24px; max-height: 120px; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; line-height: 1.5; padding: 2px 0; }
    #prompt::placeholder { color: #a0a198; }
    .send-button { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border: 0; border-radius: 50%; background: var(--accent); color: white; cursor: pointer; transition: opacity .15s, transform .15s; }
    .send-button:hover { transform: translateY(-1px); }
    .send-button:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .notice { display: none; margin: 0 0 10px; padding: 11px 13px; border: 1px solid #ead8ce; border-radius: 10px; color: #805442; background: #fff8f4; font-size: 12px; line-height: 1.5; }
    .notice.visible { display: block; }
    .toast { position: fixed; left: 50%; bottom: 26px; z-index: 5; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: white; box-shadow: var(--shadow); font-size: 12px; transition: opacity .2s, transform .2s; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .word-reveal { animation: wordFadeIn 260ms ease-out both; }
    @keyframes wordFadeIn { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { .word-reveal { animation: none; } }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @media (min-width: 1200px) { .workspace { padding-top: 42px; } }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { display: none; }
      .main { min-height: 100dvh; }
      .topbar { height: 60px; padding: 0 17px; }
      .mobile-brand { display: flex; }
      .mobile-brand .brand-mark { width: 27px; height: 27px; border-radius: 9px; font-size: 16px; }
      .model-pill { padding: 6px 8px; font-size: 10px; }
      .top-actions .desktop-only { display: none; }
      .workspace { padding: 18px 17px max(14px, env(safe-area-inset-bottom)); }
      .welcome { padding: 44px 0 48px; }
      .welcome-mark { margin-bottom: 20px; }
      h1 { letter-spacing: -1.3px; }
      .welcome-copy { font-size: 13px; }
      .suggestions { gap: 8px; margin-top: 27px; }
      .suggestion { min-height: 93px; padding: 13px; }
      .thread { gap: 23px; padding-top: 10px; }
      .message { width: 100%; }
      .message-content { max-width: 88%; }
      .message.assistant .message-content { max-width: 100%; }
      .message-text { font-size: 13px; }
      .composer-dock { left: 0; right: 0; padding: 22px 17px max(18px, env(safe-area-inset-bottom)); }
      .composer-inner { width: 100%; gap: 10px; padding-left: 0; }
      .attach-button { width: 42px; height: 42px; }
      .thread { padding-bottom: 155px; }
      .composer { min-height: 48px; padding: 7px 8px 7px 16px; border-radius: 999px; gap: 8px; }
      #prompt { font-size: 16px; max-height: 100px; }
      .send-button { width: 34px; height: 34px; }
    }
    @media (max-width: 390px) {
      .composer-dock { padding-left: 16px; padding-right: 16px; }
      .composer-inner { gap: 9px; }
      .attach-button { width: 40px; height: 40px; }
      .composer { padding-left: 14px; }
      .suggestions { grid-template-columns: 1fr; }
      .suggestion { min-height: 72px; }
      .model-pill .model-name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* Apple-inspired system styling: semantic surfaces, accessible controls, and platform-aware layout. */
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --panel: rgba(255,255,255,.82);
      --panel-soft: #eaeaed;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60,60,67,.14);
      --accent: #007aff;
      --accent-ink: #ffffff;
      --green: #248a3d;
      --shadow: 0 12px 36px rgba(0,0,0,.07);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); }
    button, textarea { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 3px;
    }
    .sidebar { background: color-mix(in srgb, var(--bg) 92%, #e5e5ea); border-color: var(--line); }
    .brand-mark, .mobile-brand .brand-mark, .welcome-mark {
      display: grid; place-items: center;
      background: #e5e5ea; color: #1d1d1f;
      border-radius: 13px; font-weight: 600;
    }
    .brand-name { letter-spacing: -.45px; }
    .new-chat {
      min-height: 44px; border-color: var(--line); border-radius: 13px;
      box-shadow: 0 1px 2px rgba(0,0,0,.025);
      transition: background-color .18s ease, transform .18s ease;
    }
    .section-label { color: var(--muted); letter-spacing: .7px; }
    .history-item { min-height: 40px; border-radius: 10px; color: var(--muted); }
    .history-item:hover, .history-item.active { background: rgba(118,118,128,.13); color: var(--ink); }
    .status-card { border-color: var(--line); border-radius: 13px; background: var(--panel); }
    .status-dot.online { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 14%, transparent); }
    .topbar {
      border-bottom-color: var(--line);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .model-pill { border-color: var(--line); background: var(--panel); color: var(--muted); }
    .model-spark { color: var(--accent); }
    .icon-button { width: 44px; height: 44px; border-radius: 12px; color: var(--muted); }
    .icon-button:hover { border-color: transparent; background: rgba(118,118,128,.12); color: var(--ink); }
    .eyebrow { color: var(--muted); letter-spacing: 1.1px; }
    h1 { letter-spacing: -1.35px; font-weight: 620; }
    .welcome-copy, .suggestion-desc { color: var(--muted); }
    .suggestion {
      min-height: 96px; border-color: var(--line); border-radius: 17px;
      background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.025);
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .suggestion-title { font-size: 13px; font-weight: 600; }
    .message.user .message-content {
      background: #e5e5ea; color: #1d1d1f;
      border-radius: 22px 22px 7px 22px;
    }
    .feedback-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .feedback-button { display: inline-grid; place-items: center; width: 32px; height: 30px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .feedback-button:hover { background: rgba(118,118,128,.12); color: var(--ink); }
    .feedback-button.selected { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
    .feedback-button svg { width: 17px; height: 17px; display: block; }
    .feedback-button:disabled { cursor: default; opacity: .65; }
    .response-metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 9px; color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .response-metrics span { display: inline-flex; align-items: center; gap: 4px; }
    .message-text { color: var(--ink); font-size: 15px; line-height: 1.72; }
    .message.user .message-text { color: inherit; }
    .message-text code { background: rgba(118,118,128,.14); }
    .message-text pre { border-color: var(--line); border-radius: 13px; background: color-mix(in srgb, var(--panel-soft) 65%, var(--bg)); }
    .attachment-chip, .pending-attachment {
      border-color: var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
    }
    .composer-dock {
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent), color-mix(in srgb, var(--bg) 92%, transparent) 24%, var(--bg) 64%);
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    .composer {
      min-height: 52px; border-color: var(--line); border-radius: 28px;
      background: var(--panel); box-shadow: 0 4px 18px rgba(0,0,0,.055);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); box-shadow: 0 4px 20px rgba(0,0,0,.075); }
    .attach-button {
      width: 46px; height: 46px; border-color: var(--line);
      background: var(--panel); color: var(--accent); box-shadow: 0 3px 12px rgba(0,0,0,.04);
      font-size: 27px; font-weight: 300;
    }
    .attach-button:hover { background: rgba(118,118,128,.12); }
    .attach-menu {
      border-color: var(--line); border-radius: 15px; background: var(--panel);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      backdrop-filter: saturate(180%) blur(24px);
    }
    .attach-option { min-height: 44px; border-radius: 10px; font-size: 14px; }
    .attach-option:hover { background: rgba(118,118,128,.12); }
    #prompt { font-size: 16px; color: var(--ink); }
    #prompt::placeholder { color: #8e8e93; }
    .send-button {
      width: 36px; height: 36px; background: var(--accent); color: white;
      transition: opacity .18s ease, transform .18s ease, background-color .18s ease;
    }
    .send-button:disabled { background: #8e8e93; opacity: .55; }
    .notice { border-color: rgba(255,149,0,.35); border-radius: 13px; color: #8a4b08; background: #fff7e6; }
    .toast { border-color: var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); }
    @media (hover: hover) and (pointer: fine) {
      .new-chat:hover, .suggestion:hover { transform: translateY(-1px); }
      .suggestion:hover { border-color: rgba(0,122,255,.25); box-shadow: 0 5px 18px rgba(0,0,0,.045); }
      .send-button:not(:disabled):hover { background: #0066d6; }
    }
    @media (max-width: 760px) {
      .topbar { padding-left: max(17px, env(safe-area-inset-left)); padding-right: max(17px, env(safe-area-inset-right)); }
      .workspace { padding-left: max(17px, env(safe-area-inset-left)); padding-right: max(17px, env(safe-area-inset-right)); }
      .composer-dock {
        padding-left: max(17px, env(safe-area-inset-left));
        padding-right: max(17px, env(safe-area-inset-right));
        padding-bottom: max(18px, env(safe-area-inset-bottom));
      }
      .composer { min-height: 50px; }
      .attach-button { width: 44px; height: 44px; }

<body>
  <div class="app">
    <aside class="sidebar" aria-label="Conversation sidebar">

        </button>

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>

        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="top-left"><button class="icon-button conversation-back-button" id="openConversations" type="button" aria-label="All conversations" title="All conversations"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button></div></header>
      <section class="conversations-page" id="conversationsPage" hidden><div class="conversations-heading"><div><div class="eyebrow">Your space</div><h2>Conversations</h2><p>Pick up where you left off.</p></div><button class="new-chat conversations-new-chat" id="conversationsNewChat" type="button"><span aria-hidden="true">＋</span> New conversation</button></div><div class="conversation-cards" id="conversationCards" aria-label="All conversations"></div></section>
      <section class="workspace" id="chatWorkspace">
        <section class="welcome" id="welcome"><div class="welcome-mark" aria-hidden="true">E</div></section>

        <section class="thread" id="thread" aria-live="polite" aria-label="Chat messages"></section>
      </section>
      <div class="composer-dock">
        <div class="composer-inner">
          <div class="attach-wrap">
            <button class="attach-button" id="attachButton" type="button" aria-label="Add photos or files" aria-expanded="false">+</button>
            <div class="attach-menu" id="attachMenu" role="menu">
              <button class="attach-option" type="button" data-picker="image"><span aria-hidden="true">▧</span> Add photos</button>
              <button class="attach-option" type="button" data-picker="file"><span aria-hidden="true">↥</span> Add files</button>
            </div>
          </div>
          <div class="composer-wrap">
            <div class="notice" id="notice" role="alert"></div>
            <div class="pending-attachments" id="pendingAttachments"></div>
            <div class="attachment-note" id="attachmentNote"></div>
            <form id="chatForm">
              <div class="composer">
                <textarea id="prompt" rows="1" maxlength="12000" placeholder="Ask Elia" aria-label="Ask Elia"></textarea>
                <button class="send-button" id="sendButton" type="submit" aria-label="Send message" disabled>
                  <svg id="sendIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
                </button>
              </div>
            </form>
            <input id="imagePicker" type="file" accept="image/*" multiple hidden>
            <input id="filePicker" type="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.ts,.py,.c,.cpp,.h,.hpp,.xml,.yaml,.yml,.log,.pdf,.doc,.docx,.xlsx,.pptx" multiple hidden>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const welcome = $("#welcome");
      const thread = $("#thread");
      const promptBox = $("#prompt");
      const sendButton = $("#sendButton");
      const sendIcon = $("#sendIcon");
      const notice = $("#notice");
      const historyBox = $("#history");
      const STORAGE_KEY = "elia-chat-v1";
      let conversations = [];
      let currentId = null;
      let busy = false;
      let health = { configured: false, model: "Groq AI" };
      let toastTimer;
      let pendingFiles = [];
      const scrollToLatest = (behavior = "smooth") => requestAnimationFrame(() => window.scrollTo({ top: document.documentElement.scrollHeight, behavior }));
      const fileTextExtensions = /\.(txt|md|csv|json|html|css|js|ts|py|c|cpp|h|hpp|xml|yaml|yml|log)$/i;
      const readTextFile = (file) => new Promise((resolve) => {
        if (file.size > 200000) return resolve("[File " + file.name + " is too large to include as text.]");
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => resolve("[Could not read " + file.name + ".]");
        reader.readAsText(file);
      });
      const renderPendingFiles = () => {
        const wrap = $("#pendingAttachments");
        wrap.innerHTML = pendingFiles.map((item, index) => '<div class="pending-attachment"><span>' + escapeHtml(item.file.name) + '</span><button type="button" data-remove-file="' + index + '" aria-label="Remove ' + escapeHtml(item.file.name) + '">×</button></div>').join("");
        wrap.querySelectorAll("[data-remove-file]").forEach((button) => button.addEventListener("click", () => {
          pendingFiles.splice(Number(button.dataset.removeFile), 1);
          renderPendingFiles();
          resizePrompt();
        }));
        $("#attachmentNote").textContent = pendingFiles.some((item) => item.file.type.startsWith("image/")) ? "Images can be attached, but GPT-OSS 20B currently processes text only." : "";
      };
      const pickFiles = (files) => {
        for (const file of Array.from(files || [])) {
          if (pendingFiles.length >= 5) { showToast("Attach up to 5 files per message."); break; }
          if (file.size > 8 * 1024 * 1024) { showToast(file.name + " is larger than 8 MB."); continue; }
          if (pendingFiles.some((item) => item.file.name === file.name && item.file.size === file.size)) continue;
          pendingFiles.push({ file, text: "", preview: file.type.startsWith("image/") ? URL.createObjectURL(file) : "" });
        }
        renderPendingFiles();
        resizePrompt();
      };

      const formatDuration = (durationMs) => {
        if (!Number.isFinite(durationMs) || durationMs < 0) return "—";
        const seconds = durationMs / 1000;
        return seconds < 10 ? seconds.toFixed(1) + "s" : Math.round(seconds) + "s";
      };
      const uid = () => (globalThis.crypto?.randomUUID?.() || String(Date.now()) + Math.random().toString(36).slice(2));
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const getCurrent = () => conversations.find((item) => item.id === currentId);
      const save = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations.slice(0, 30))); if (currentId) localStorage.setItem("elia-current-conversation-v1", currentId); }
        catch { showToast("Could not save chat history on this device."); }
      };
      const showToast = (text) => {
        const toast = $("#toast");
        toast.textContent = text;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
      };
      const setNotice = (text) => {
        notice.textContent = text || "";
        notice.classList.toggle("visible", Boolean(text));
      };
      const setBusy = (value) => {
        busy = value;
        sendButton.disabled = value || (!promptBox.value.trim() && !pendingFiles.length);
        sendIcon.innerHTML = value
          ? '<path d="M6 6h12v12H6z"/>'
          : '<path d="M12 19V5m-6 6 6-6 6 6"/>';
        sendButton.setAttribute("aria-label", value ? "Waiting for response" : "Send message");
      };
      const titleFor = (messages) => {
        const first = messages.find((message) => message.role === "user");
        if (!first) return "New conversation";
        const title = first.content.replace(/\s+/g, " ").trim();
        return title.length > 32 ? title.slice(0, 32).trim() + "…" : title;
      };
      const newConversation = (focus = true) => {
        currentId = uid();
        conversations.unshift({ id: currentId, title: "New conversation", messages: [], updatedAt: Date.now() });
        renderHistory();
        renderChat();
        save();
        if (focus) promptBox.focus();
      };
      const latestAssistantMessage = (conversation) => [...(conversation.messages || [])].reverse().find((message) => message.role === "assistant");
      const imageFromMessage = (message) => {
        if (!message) return "";
        const attachment = (message.attachments || []).find((item) => item.image);
        if (attachment && attachment.image) return attachment.image;
        const match = String(message.content || "").match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/i);
        return match ? match[1] : "";
      };
      const previewFromMessage = (message) => {
        if (!message) return "No assistant response yet";
        if (imageFromMessage(message)) return "Image from Elia";
        return String(message.displayContent ?? message.content ?? "").replace(/!\[[^\]]*\]\([^)]*\)/g, "[Image]").replace(/[ #>*_]/g, "").replace(/\\s+/g, " ").trim() || "No text preview";
      };
      const renderConversationCards = () => {
        const cards = $("#conversationCards");
        if (!conversations.length) { cards.innerHTML = '<div class="conversation-card-empty">Your conversations will appear here.</div>'; return; }
        cards.innerHTML = conversations.map((conversation) => {
          const lastAssistant = latestAssistantMessage(conversation);
          const image = imageFromMessage(lastAssistant);
          const title = conversation.title || "New conversation";
          const preview = previewFromMessage(lastAssistant);
          return '<button type="button" class="conversation-card ' + (image ? "has-image" : "") + '" data-conversation-id="' + escapeHtml(conversation.id) + '" title="' + escapeHtml(title) + '">'
            + (image ? '<img class="conversation-card-image" src="' + escapeHtml(image) + '" alt="" loading="lazy">' : '')
            + '<span class="conversation-card-top"><span class="conversation-card-ai" aria-hidden="true">e</span><span class="conversation-card-title">' + escapeHtml(title) + '</span></span>'
            + '<span class="conversation-card-bottom">' + escapeHtml(preview) + '</span></button>';
        }).join("");
        cards.querySelectorAll("[data-conversation-id]").forEach((card) => card.addEventListener("click", () => {
          if (busy) return showToast("Wait for the current response to finish.");
          currentId = card.dataset.conversationId;
          try { localStorage.setItem("elia-current-conversation-v1", currentId); } catch {}
          setConversationPage(false); renderHistory(); renderChat();
        }));
      };
      const setConversationPage = (show) => {
        $("#conversationsPage").hidden = !show;
        $("#chatWorkspace").hidden = show;
        $("#openConversations").setAttribute("aria-label", show ? "Back to chat" : "All conversations");
        $("#openConversations").setAttribute("title", show ? "Back to chat" : "All conversations");
        $("#openConversations").innerHTML = show
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>';
        if (show) renderConversationCards();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      const renderHistory = () => {
        if (!conversations.length) { historyBox.innerHTML = '<div class="history-empty">Your conversations will appear here.</div>'; renderConversationCards(); return; }
        historyBox.innerHTML = conversations.slice(0, 20).map((conversation) =>
          '<button class="history-item ' + (conversation.id === currentId ? "active" : "") + '" data-id="' + escapeHtml(conversation.id) + '" title="' + escapeHtml(conversation.title) + '">'
          + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.6-.85L4 20l1.85-4.9A7.5 7.5 0 1 1 20 11.5Z"/></svg>'
          + '<span>' + escapeHtml(conversation.title) + '</span></button>').join("");
        historyBox.querySelectorAll("[data-id]").forEach((button) => button.addEventListener("click", () => {
          if (busy) return showToast("Wait for the current response to finish.");
          currentId = button.dataset.id;
          try { localStorage.setItem("elia-current-conversation-v1", currentId); } catch {}
          renderHistory(); renderChat();
        }));
        renderConversationCards();
      };
      const formatText = (text) => {
        const escaped = escapeHtml(text);
        return escaped
          .replace(/```([\s\S]*?)```/g, (_, code) => '<pre><code>' + code.trim() + '</code></pre>')
          .replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br>");
      };
      const appendMessage = (message, options = {}) => {
        const row = document.createElement("article");
        row.className = "message " + message.role;
        const attachmentMarkup = (message.attachments || []).map((attachment) => attachment.image
          ? '<div class="attachment-chip"><img src="' + escapeHtml(attachment.image) + '" alt=""><span>' + escapeHtml(attachment.name) + '</span></div>'
          : '<div class="attachment-chip"><span aria-hidden="true">▤</span><span>' + escapeHtml(attachment.name) + '</span></div>').join("");
        const metricsMarkup = message.role === "assistant" && Number.isFinite(message.durationMs) && message.durationMs >= 60000
          ? '<div class="response-metrics"><span>Worked for ' + escapeHtml(formatDuration(message.durationMs)) + '</span><span>Token Consumed ' + (Number.isFinite(message.totalTokens) ? escapeHtml(message.totalTokens.toLocaleString()) : "—") + '</span></div>'
          : "";
        const feedbackMarkup = message.role === "assistant"
          ? '<div class="feedback-actions" aria-label="Rate this response" data-message-id="' + escapeHtml(message.id || (message.id = uid())) + '">'
            + '<button class="feedback-button ' + (message.feedback === "up" ? "selected" : "") + '" type="button" data-feedback="up" aria-label="Thumbs up" aria-pressed="' + String(message.feedback === "up") + '" title="Thumbs up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3Zm0 0 5-8c2 0 3 2 2 4l-1 4h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 2H7"/></svg></button>'
            + '<button class="feedback-button ' + (message.feedback === "down" ? "selected" : "") + '" type="button" data-feedback="down" aria-label="Thumbs down" aria-pressed="' + String(message.feedback === "down") + '" title="Thumbs down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14V3H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3Zm0 0 5 8c2 0 3-2 2-4l-1-4h6a2 2 0 0 0 2-2l-2-7a2 2 0 0 0-2-2H7"/></svg></button>'
            + '</div>' : "";
        row.innerHTML = '<div class="message-content">' + metricsMarkup + '<div class="message-text">' + formatText(message.displayContent ?? message.content ?? "") + '</div>' + (attachmentMarkup ? '<div class="message-attachments">' + attachmentMarkup + '</div>' : '') + feedbackMarkup + '</div>';
        if (options.animateWords && message.role === "assistant") {
          const messageText = row.querySelector(".message-text");
          const walker = document.createTreeWalker(messageText, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          let wordIndex = 0;
          for (const textNode of textNodes) {
            const parts = textNode.nodeValue.match(/\s+|[^\s]+/g) || [];
            if (!parts.some((part) => !/^\s+$/.test(part))) continue;
            const fragment = document.createDocumentFragment();
            for (const part of parts) {
              if (/^\s+$/.test(part)) {
                fragment.appendChild(document.createTextNode(part));
              } else {
                const word = document.createElement("span");
                word.className = "word-reveal";
                word.style.animationDelay = Math.min(wordIndex * 18, 900) + "ms";
                word.textContent = part;
                fragment.appendChild(word);
                wordIndex += 1;
              }
            }
            textNode.parentNode.replaceChild(fragment, textNode);
          }
        }
        thread.appendChild(row);
        scrollToLatest();
      };
      const renderChat = () => {
        const conversation = getCurrent();
        const messages = conversation?.messages || [];
        welcome.style.display = messages.length ? "none" : "flex";
        thread.classList.toggle("visible", Boolean(messages.length));
        thread.innerHTML = "";
        messages.forEach(appendMessage);
        if (messages.length) requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
      };
      const addTyping = () => {
        const row = document.createElement("article");
        row.className = "message assistant";
        row.id = "typingIndicator";
        row.innerHTML = '<div class="message-content"><div class="thinking-details"><div class="thinking-metrics" id="workingTokenCount" hidden>Token Consumed —</div><div class="thinking-status"><span class="working-label">Working</span><div class="typing" aria-label="Elia is thinking"><span></span><span></span><span></span></div></div></div></div>';
        thread.appendChild(row);
        row._tokenRevealTimer = window.setTimeout(() => {
          const tokenLabel = row.querySelector("#workingTokenCount");
          if (tokenLabel && row.isConnected) tokenLabel.hidden = false;
        }, 60000);
        scrollToLatest();
      };
      const resizePrompt = () => {
        promptBox.style.height = "auto";
        promptBox.style.height = Math.min(promptBox.scrollHeight, 180) + "px";
        const charCount = $("#charCount");
        if (charCount) charCount.textContent = promptBox.value.length.toLocaleString() + " / 12000";
        sendButton.disabled = busy || (!promptBox.value.trim() && !pendingFiles.length);
      };
      const send = async (rawText) => {
        const text = String(rawText || "").trim();
        if ((!text && !pendingFiles.length) || busy) return;
        setNotice("");
        if (!currentId || !getCurrent()) newConversation(false);
        const conversation = getCurrent();
        const filesToSend = pendingFiles.slice();
        pendingFiles = [];
        renderPendingFiles();
        const attachmentMeta = filesToSend.map((item) => ({ name: item.file.name, image: item.preview || "" }));
        let promptText = text;
        for (const item of filesToSend) {
          if (fileTextExtensions.test(item.file.name) && !item.file.type.startsWith("image/")) {
            const extracted = await readTextFile(item.file);
            promptText += (promptText ? "\n\n" : "") + "[Attached file: " + item.file.name + "]\n" + extracted;
          } else if (item.file.type.startsWith("image/")) {
            promptText += (promptText ? "\n\n" : "") + "[Attached image: " + item.file.name + ". The current model cannot inspect image pixels.]";
          } else {
            promptText += (promptText ? "\n\n" : "") + "[Attached file: " + item.file.name + " (" + item.file.type + ", " + item.file.size + " bytes). This file type is attached for reference but its contents were not extracted.]";
          }
        }
        if (!promptText.trim()) promptText = "Please review the attached file(s).";
        conversation.messages.push({ role: "user", content: promptText, displayContent: text, attachments: attachmentMeta });
        conversation.title = titleFor(conversation.messages);
        conversation.updatedAt = Date.now();
        promptBox.value = "";
        resizePrompt();
        welcome.style.display = "none";
        thread.classList.add("visible");
        appendMessage(conversation.messages[conversation.messages.length - 1]);
        addTyping();
        renderHistory();
        save();
        setBusy(true);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: conversation.messages.map(({ role, content }) => ({ role, content })) })
          });
          const data = await response.json().catch(() => ({}));
          const typingRow = $("#typingIndicator");
          if (typingRow?._tokenRevealTimer) window.clearTimeout(typingRow._tokenRevealTimer);
          typingRow?.remove();
          if (!response.ok) throw new Error(data.error || "Something went wrong. Please try again.");
          conversation.messages.push({
            id: uid(),
            role: "assistant",
            content: data.reply,
            durationMs: Number.isFinite(data.durationMs) ? data.durationMs : null,
            totalTokens: Number.isFinite(data.totalTokens) ? data.totalTokens : null
          });
          conversation.updatedAt = Date.now();
          appendMessage(conversation.messages[conversation.messages.length - 1], { animateWords: true });
          save();
          renderHistory();
        } catch (error) {
          const typingRow = $("#typingIndicator");
          if (typingRow?._tokenRevealTimer) window.clearTimeout(typingRow._tokenRevealTimer);
          typingRow?.remove();
          setNotice(error.message || "Could not reach Elia. Check your connection and try again.");
          if (conversation.messages.at(-1)?.role === "user") {
            // Keep the user message in history so it can be retried or copied.
          }
        } finally {
          setBusy(false);
          promptBox.focus();
          scrollToLatest();
        }
      };

      thread.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-feedback]");
        if (!button || button.disabled) return;
        const actions = button.closest(".feedback-actions");
        const conversation = getCurrent();
        const message = conversation?.messages.find((item) => item.role === "assistant" && item.id === actions?.dataset.messageId);
        if (!message) return;
        const vote = button.dataset.feedback;
        const previousVote = message.feedback || null;
        if (previousVote === vote) return;
        message.feedback = vote;
        actions.querySelectorAll("[data-feedback]").forEach((item) => {
          const selected = item.dataset.feedback === vote;
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-pressed", String(selected));
        });
        save();
        button.disabled = true;
        try {
          const response = await fetch("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messageId: message.id, vote, previousVote })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "Feedback could not be saved.");
        } catch {
          message.feedback = previousVote;
          actions.querySelectorAll("[data-feedback]").forEach((item) => {
            const selected = item.dataset.feedback === previousVote;
            item.classList.toggle("selected", selected);
            item.setAttribute("aria-pressed", String(selected));
          });
          showToast("Could not send feedback. Try again.");
          save();
        } finally {
          button.disabled = false;
        }
      });

      $("#chatForm").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!busy) send(promptBox.value);
      });
      $("#attachButton").addEventListener("click", () => {
        const menu = $("#attachMenu");
        const open = !menu.classList.contains("open");
        menu.classList.toggle("open", open);
        $("#attachButton").setAttribute("aria-expanded", String(open));
      });
      document.querySelectorAll("[data-picker]").forEach((button) => button.addEventListener("click", () => {
        $("#attachMenu").classList.remove("open");
        $("#attachButton").setAttribute("aria-expanded", "false");
        (button.dataset.picker === "image" ? $("#imagePicker") : $("#filePicker")).click();
      }));
      $("#imagePicker").addEventListener("change", (event) => { pickFiles(event.target.files); event.target.value = ""; });
      $("#filePicker").addEventListener("change", (event) => { pickFiles(event.target.files); event.target.value = ""; });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".attach-wrap")) {
          $("#attachMenu").classList.remove("open");
          $("#attachButton").setAttribute("aria-expanded", "false");
        }
      });
      promptBox.addEventListener("input", resizePrompt);
      promptBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          if (!busy) send(promptBox.value);
        }
      });
      $("#newChat").addEventListener("click", () => {
        if (busy) return showToast("Wait for the current response to finish.");
        newConversation(); setConversationPage(false);
      });
      $("#openConversations").addEventListener("click", () => setConversationPage($("#conversationsPage").hidden));
      $("#conversationsNewChat").addEventListener("click", () => {
        if (busy) return showToast("Wait for the current response to finish.");
        newConversation(); setConversationPage(false);
      });
      document.querySelectorAll("[data-prompt]").forEach((button) => button.addEventListener("click", () => {
        promptBox.value = button.dataset.prompt;
        resizePrompt();
        promptBox.focus();
      }));
      $("#clearChat").addEventListener("click", () => {
        if (busy) return showToast("Wait for the current response to finish.");
        const conversation = getCurrent();
        if (!conversation || !conversation.messages.length) return showToast("This conversation is already empty.");
        conversation.messages = [];
        conversation.title = "New conversation";
        conversation.updatedAt = Date.now();
        renderChat(); renderHistory(); save(); setNotice("");
        showToast("Conversation cleared.");
      });
      $("#exportChat").addEventListener("click", () => {
        const conversation = getCurrent();
        if (!conversation?.messages.length) return showToast("There is no conversation to export yet.");
        const content = conversation.messages.map((message) => (message.role === "user" ? "You" : "Elia") + "\n" + message.content).join("\n\n---\n\n");
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url; anchor.download = (conversation.title || "elia-conversation").replace(/[^a-z0-9-]/gi, "-").toLowerCase() + ".txt";
        anchor.click(); URL.revokeObjectURL(url);
      });

      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(stored)) conversations = stored.filter((item) => item && typeof item.id === "string" && Array.isArray(item.messages)).slice(0, 30);
      } catch { conversations = []; }
      const navigationEntry = performance.getEntriesByType("navigation")[0];
      const isRefresh = navigationEntry && navigationEntry.type === "reload";
      let savedCurrentId = null;
      try { savedCurrentId = localStorage.getItem("elia-current-conversation-v1"); } catch {}
      if (isRefresh && savedCurrentId && conversations.some((item) => item.id === savedCurrentId)) {
        currentId = savedCurrentId; renderHistory(); renderChat();
      } else { newConversation(false); }
      resizePrompt();
      fetch("/api/health").then((response) => response.json()).then((data) => {
        health = data;
        $("#statusDot").classList.toggle("online", Boolean(data.ok && data.configured));
        $("#statusTitle").textContent = data.configured ? "Ready to chat" : "API key not configured";
        $("#statusSub").textContent = data.configured ? "Connected through a secure server" : "Add GROQ_API_KEY in Render";
      }).catch(() => {
        $("#statusTitle").textContent = "Connection unavailable";
        $("#statusSub").textContent = "Check the server and try again";
      });
    })();
  </script>
</body>
</html>
